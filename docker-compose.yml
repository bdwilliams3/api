services:
  k-api:
    image: ghcr.io/bdwilliams3/api:latest
    restart: unless-stopped
    # The Go binary never writes to disk, so lock the root filesystem.
    read_only: true
    # Cap CPU/memory so a DoS against the challenge can't starve the host.
    cpus: '0.5'
    mem_limit: 128m
    environment:
      INTERNAL_SEED: ${INTERNAL_SEED}
      API_USER: ${API_USER:-api_hunter}
      API_PASS: ${API_PASS}
    # Bound to localhost only — public traffic reaches it via the native
    # cloudflared Windows service -> http://localhost:8080.
    ports:
      - "127.0.0.1:8080:8080"
